# The service environment supplies the HTTPS endpoint and bucket credentials.
snapshot:
  interval: 24h

levels:
  - interval: 5m
  - interval: 1h

dbs:
  - path: /var/lib/headscale/db.sqlite
    replica:
      type: s3
      bucket: hm-hs1-litestream
      path: hs1
      region: auto
      endpoint: "$HEADMESH_R2_ENDPOINT"
      force-path-style: true
      sync-interval: 10s
