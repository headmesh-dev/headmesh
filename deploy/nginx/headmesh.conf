# Headmesh: http-level settings shared by every environment. Managed by deploy/deploy.sh; installed as
# /etc/nginx/conf.d/headmesh.conf. Local edits on the server are reported as drift and replaced only with
# --nginx-overwrite.

# Cloudflare proxies headmesh.dev. Trust CF-Connecting-IP only from Cloudflare's own ranges, so $remote_addr is the
# real client everywhere below (rate limits, logs, the X-Real-IP the services see).
include /etc/nginx/headmesh/cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;

# Waitlist sign-ups: a few per minute per client, with a small burst. The service also caps each IP at 10 an hour.
limit_req_zone $binary_remote_addr zone=headmesh_waitlist:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=headmesh_api:20m rate=20r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=headmesh_conn:10m;

map $http_upgrade $headmesh_connection_upgrade {
    default upgrade;
    ''      close;
}

# $uri, not $request_uri: query strings (one-click unsubscribe tokens, UTM tags) never reach the logs.
log_format headmesh_json escape=json
    '{"time":"$time_iso8601","host":"$host","client":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstream":"$upstream_addr","upstream_duration":"$upstream_response_time","agent":"$http_user_agent"}';


# Requests for hostnames no Headmesh vhost serves (scanners hitting the bare IP, stale DNS) get no answer. TLS
# handshakes for unknown names are refused before any certificate is shown. Replaces Ubuntu's default site, which
# the server bootstrap disables.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}
