# Proxy settings for the loopback services. X-Forwarded-For is replaced, not appended: after real_ip it holds only
# the client address, which the backend trusts (HEADMESH_TRUST_FORWARDED_FOR=true) and the waitlist reads as
# X-Real-IP.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $headmesh_connection_upgrade;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 90s;
