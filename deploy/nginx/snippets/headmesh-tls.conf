# TLS for every Headmesh vhost. /etc/headmesh/tls/*.pem point at the Let's Encrypt certificate for headmesh.dev and
# *.headmesh.dev (DNS-01 through Cloudflare), or at a self-signed placeholder until that certificate exists.
ssl_certificate     /etc/headmesh/tls/fullchain.pem;
ssl_certificate_key /etc/headmesh/tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:headmesh_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# Per server rather than in http {}: Ubuntu's nginx.conf may set it there already, and a second http-level copy
# fails nginx -t.
server_tokens off;
