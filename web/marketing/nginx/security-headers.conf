# Security headers for every response nginx serves for headmesh.dev (and test.headmesh.dev).
#
# This is a template: `pnpm build` (scripts/csp.mjs) replaces {{SCRIPT_HASHES}} and {{STYLE_HASHES}} with the
# SHA-256 hashes of every inline <script> and <style> in dist/ and writes the result to
# build/nginx/security-headers.conf. The deploy ships that file with each release; the vhost includes it at server
# level and again in every location that sets its own headers (nginx doesn't merge add_header across levels).
#
# Scripts and <style> elements are hash-only. Inline style *attributes* are allowed (style-src-attr) because
# Starlight and Expressive Code set CSS custom properties that way; attributes can't load anything (img-src and
# font-src are 'self') and can't run script.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' {{SCRIPT_HASHES}} https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' {{STYLE_HASHES}}; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
