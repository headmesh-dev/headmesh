#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages project for headmesh.dev. With this file present, wrangler.toml (not the dashboard) is the source
# of truth for the project's bindings and variables. Secrets are never stored here; see README.md.
name = "headmesh-marketing"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-20"

# Production (and the default for `wrangler pages dev`).
[vars]
SITE_URL = "https://headmesh.dev"
EMAIL_FROM = "Headmesh <waitlist@mail.headmesh.dev>"
EMAIL_REPLY_TO = "hello@headmesh.dev"
EMAIL_DELIVERY = "resend"

[[d1_databases]]
binding = "DB"
database_name = "headmesh-waitlist"
# Replace with the id printed by `wrangler d1 create headmesh-waitlist` (README, "One-time setup").
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Preview deployments (every branch except main). They get their own database and never send real email: the
# confirmation links go to the Function log (`wrangler pages deployment tail`).
[env.preview.vars]
SITE_URL = ""
EMAIL_FROM = "Headmesh <waitlist@mail.headmesh.dev>"
EMAIL_REPLY_TO = "hello@headmesh.dev"
EMAIL_DELIVERY = "log"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "headmesh-waitlist-preview"
# Replace with the id printed by `wrangler d1 create headmesh-waitlist-preview`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
