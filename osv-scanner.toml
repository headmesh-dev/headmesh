# osv-scanner (ci-security.yml). Every ignore says why and expires, so it's looked at again rather than forgotten.

# golang.org/x/crypto/openpgp is deprecated and has no fix. Nothing here imports it (govulncheck: not reachable).
[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "Advisory for the deprecated x/crypto/openpgp package, which no Headmesh code imports."
ignoreUntil = 2027-04-30

# Fixed in golang.org/x/net v0.62.0, released 2026-10-27; the repo waits 3 days before adopting a release (ADR
# 0010), so Renovate brings it after that. govulncheck reports neither as reachable (both are in x/net/html).
[[IgnoredVulns]]
id = "GO-2026-6860"
reason = "x/net/html only, not reachable; v0.62.0 adopted once it is 3 days old."
ignoreUntil = 2026-11-07
[[IgnoredVulns]]
id = "GO-2026-6866"
reason = "x/net/html only, not reachable; v0.62.0 adopted once it is 3 days old."
ignoreUntil = 2026-11-07

# Build and test tools only (Lighthouse CI, Puppeteer and Playwright's browser tooling, satori for build-time OG
# images). None of them ships: the deployed waitlist service depends on zod 4.6.7 alone, and the tools only ever see
# this repository's own inputs.
[[PackageOverrides]]
ecosystem = "npm"
name = "basic-ftp"
ignore = true
reason = "Dev-only, via @lhci/cli > proxy-agent > get-uri; never fetches from FTP."
[[PackageOverrides]]
ecosystem = "npm"
name = "extract-zip"
ignore = true
reason = "Dev-only, via @puppeteer/browsers (Lighthouse's browser download); no fixed release exists."
[[PackageOverrides]]
ecosystem = "npm"
name = "tmp"
ignore = true
reason = "Dev-only, via @lhci/cli > inquirer > external-editor."
[[PackageOverrides]]
ecosystem = "npm"
name = "uuid"
ignore = true
reason = "Dev-only, via @lhci/cli."
[[PackageOverrides]]
ecosystem = "npm"
name = "fflate"
ignore = true
reason = "Build-time only, via satori's font parser, on this repository's own font files."
[[PackageOverrides]]
ecosystem = "npm"
name = "zod"
version = "3.25.76"
ignore = true
reason = "Dev-only zod 3 copy pulled in by chromium-bidi (Playwright/Puppeteer); the waitlist service uses zod 4.6.7."
