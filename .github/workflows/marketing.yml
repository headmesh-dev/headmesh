name: marketing

# headmesh.dev (web/marketing, plan §12.1): lint, type-check, the waitlist service's tests, build, Playwright + axe
# smoke tests and Lighthouse budgets on every change. Deploys run from a workstation with deploy/deploy.sh
# (--target frontend), never from CI, and never touch the product (ADR 0013).

on:
  pull_request:
    paths:
      - web/marketing/**
      - pnpm-lock.yaml
      - .github/workflows/marketing.yml
  push:
    branches: [main]
    paths:
      - web/marketing/**
      - pnpm-lock.yaml
      - .github/workflows/marketing.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.16.0
  PNPM_VERSION: 10.34.9

defaults:
  run:
    working-directory: web/marketing

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (root workspace lockfile)
        run: pnpm --dir ../.. install --frozen-lockfile --filter @headmesh/marketing...

      - name: Lint and type-check
        run: pnpm run lint

      - name: Waitlist service and CSP tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium for Playwright and Lighthouse
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright + axe smoke tests
        run: pnpm test:e2e

      - name: Let Chrome use its sandbox on Ubuntu 26.04
        # Ubuntu 23.10+ blocks unprivileged user namespaces through AppArmor, so the Chrome that Lighthouse
        # launches exits with "No usable sandbox!". Lifting the restriction for this throwaway runner keeps
        # Chrome's sandbox on, which --no-sandbox would not.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Lighthouse budgets (≥ 95 in every category)
        run: |
          CHROME_PATH="$(node --input-type=module -e "const { chromium } = await import('@playwright/test'); console.log(chromium.executablePath())")"
          export CHROME_PATH
          pnpm run lhci

      - name: Keep test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-reports
          path: |
            web/marketing/playwright-report/
            web/marketing/.lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
          # .lighthouseci/ is a dot-directory, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
