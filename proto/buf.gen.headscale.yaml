# Vendored Headscale v0.29.6 API: plain gRPC client stubs (the cell agent dials Headscale's unix socket).
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/headmesh-dev/headmesh/gen
  disable:
    - module: buf.build/googleapis/googleapis
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: [paths=source_relative, require_unimplemented_servers=false]
inputs:
  - directory: proto
    paths: [proto/headscale]
