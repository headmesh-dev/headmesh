# yaml-language-server: $schema=../schemas/plugin-source.schema.json
#
# Source for every manifest and MCP config in this directory. Edit this file, then run
# `pnpm -C plugins gen`. Skills and commands are written by hand.

name: headmesh
displayName: Headmesh
version: 0.1.0
description: Agent sandboxes on your own machines over a private Headscale mesh
author:
  name: Headmesh
  email: hello@headmesh.dev
  url: https://headmesh.dev
homepage: https://github.com/headmesh-dev/headmesh/tree/main/plugins/headmesh
repository: https://github.com/headmesh-dev/headmesh
license: Apache-2.0
keywords: [headmesh, headscale, tailscale, sandbox, mcp, remote-development, multi-agent]

links:
  website: https://headmesh.dev
  privacyPolicy: https://headmesh.dev/privacy
  termsOfService: https://headmesh.dev/terms

userConfig:
  sandbox_url:
    type: string
    title: Sandbox MCP URL
    description: The headmesh-sandboxd endpoint, either its MagicDNS URL on your tailnet or its Headmesh ingress URL.
    default: https://asus.sbx.headmesh.dev/mcp
    required: true
  sandbox_token:
    type: string
    title: Sandbox token
    description: The bearer token (starts with hms_) that your sandbox issued for this client. Stored in your system keychain.
    sensitive: true
    required: true

mcpServers:
  headmesh-sandbox:
    # Portable mcp.json can't take placeholders or secrets, so Codex gets the default URL with
    # no token. Codex users shadow it with `codex mcp add headmesh-sandbox --url … --bearer-token-env-var …`
    # (see plugins/README.md). From M3 the sandbox does OAuth and this needs no override.
    url: https://asus.sbx.headmesh.dev/mcp
    claude:
      url: ${user_config.sandbox_url}
      headers:
        Authorization: Bearer ${user_config.sandbox_token}
    openaiAuth:
      type: api_key
      headerScheme: bearer

openai:
  interface:
    shortDescription: Run agents in a persistent sandbox on your own machine
    longDescription: >-
      Connect Codex to a Headmesh sandbox: a long-lived container on your own hardware that joins
      your private Headscale mesh. Run commands, keep interactive sessions alive across disconnects,
      edit real project files and reach private services by MagicDNS name, with a shared protocol
      that keeps several agents from overwriting each other's work.
    developerName: Headmesh
    category: Developer Tools
    capabilities: [Read, Write]
    defaultPrompt:
      - Check my Headmesh sandbox status and report anything unhealthy.
      - Run the Headmesh sandbox acceptance checks and summarise the results.
    # The D4 app icon (web/marketing/public/brand/headmesh-v1/icons/icon-512.png) and --hm-mint from its tokens.css.
    brandColor: "#3CEFB4"
    logo: ./assets/logo.png
