# tmux server for the sandbox (plan §6.7, §6.8): `tmux -D -L headmesh -f /etc/headmesh/tmux.conf`.
# sandboxd sessions are windows `s-<id>` in the session `headmesh`; Remote Control is `rc`.
# Watch live from the host with `headmesh sandbox attach`.

# Keep the server up with no sessions (also implied by -D).
set -s exit-empty off
set -s escape-time 10
# Dead panes stay so sandboxd can read the exit status (#{pane_dead_status}).
set -g remain-on-exit on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -g mouse on
set -g base-index 0
setw -g aggressive-resize on
set -g status-left-length 40
set -g status-left "#(cat /run/hm-state/mode-label 2>/dev/null)[#S] "
set -g status-right "%H:%M %Z"
